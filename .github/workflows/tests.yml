name: tests
on:
  push:
    branches: ["main"]
  pull_request:
    # GitHub matches this filter against the pull request's BASE branch, not its head branch, so a
    # branch that pull requests are opened against has to appear here or those pull requests get no
    # pytest gate at all. The authz/v1 stack does exactly that: #42 is stacked on this branch, so
    # listing only "main" left #42 with docs-check and secret scanning and no test run. Listed by
    # name on purpose -- no wildcard, so the set of gated base branches stays auditable, and the
    # push trigger below stays main-only.
    branches:
      - "main"
      - "test/authz-v1-exact-capability-issuance"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # `python -m pytest` (not bare `pytest`) puts the repo root on sys.path so tests can
        # import the top-level `adapters` and `golden` packages; bare pytest fails collection.
        run: python -m pytest -q
